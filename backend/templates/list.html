{% load static %}

<c-base>
  <div class="h-full w-full p-8 flex flex-col gap-8">
    <!-- Coursework List -->
    <div class=" p-6 rounded-lg shadow-lg">
      <h2 class="text-2xl font-bold text-white mb-4">Courseworks OverView</h2>
      {% for coursework in coursework_list %}
        
        {% if coursework.answer %}
          <a href="{% url 'coursework' coursework.pk %}"" class="flex justify-between py-3 border-b ">
            <p class="text-gray-300">{{ coursework.question | title}} </p>
            <p class="text-gray-400 text-sm">{{ coursework.created|date:"M d, Y" }} </p>
            <a href="{% url 'editor' pk=coursework.pk %}">Edit</a>
          </a>

        {% endif %}

      {% endfor %}
    </div>
    <div class="h-30">
    
    </div>





</div>
</c-base>
