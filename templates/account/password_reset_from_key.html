{% extends 'base.html' %}

{% block content %}
<div class="h-screen w-screen flex flex-col items-center justify-center text-white">
  <h1 class="text-4xl mb-4">Change Password</h1>

  <form method="post" action="/accounts/password/reset/key/4-set-password/" class="bg-black p-4 shadow-md rounded-md w-full max-w-xs">
    {% csrf_token %}
    <div class="mb-4">
      <label for="id_password1" class="block text-sm font-medium text-white">New Password:</label>
      <input type="password" name="password1" placeholder="New Password" required class="mt-1 block w-full border border-gray-300 rounded-md p-2 shadow-sm focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm h-10">
    </div>

    <div class="mb-4">
      <label for="id_password2" class="block text-sm font-medium text-white">New Password (again):</label>
      <input type="password" name="password2" placeholder="New Password (again)" required class="mt-1 block w-full border border-gray-300 rounded-md p-2 shadow-sm focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm h-10">
    </div>

    <div class="flex justify-between">
      <button type="submit" class="bg-orange-500 hover:bg-orange-600 text-white font-bold py-2 px-4 rounded h-10">Change Password</button>
      <button type="submit" form="logout-form" class="bg-orange-500 hover:bg-orange-600 text-white font-bold py-2 px-4 rounded h-10">Cancel</button>
    </div>
  </form>

  <form id="logout-form" method="post" action="/accounts/logout/" class="hidden">
    {% csrf_token %}
  </form>
</div>
{% endblock content %}
