{% load static %}
{% block header %}
{{ form.media }}
{% endblock header %}

<c-base>
  <div id="form-2" class="flex h-full w-full gap-[2px] bg-white lg:pl-56 lg:pr-56 lg:pt-16 ">
    <div id="editor-body" class="h-full w-full">
      <form action="{% url 'editor' pk=object.pk %}" method="post" class="bg-white text-white flex flex-col gap-8 items-center relative">
        {% csrf_token %}
        {% comment %} <div class="flex-col gap-2 pt-4 hidden">
          <label for="{{ form.question.id_for_label }}">Question</label>
          {{ form.question }}
        </div> {% endcomment %}
        <label for="{{ form.answer.id_for_label }}" class="text-black">
          {{ form.answer }}
        </label>
        <div class="w-full flex justify-between fixed bottom-30 flex-col items-center shadow-4xl shadow-amber-700">
          <button type="submit" class="h-12 w-50 cursor-grab bg-black hover:bg-orange-600 text-white font-montserrat mt-8 rounded-sm">Save</button>
        </div>
      </form>
    </div>
  </div>


  <!-- Load CKEditor 5 from static files -->
  <script src="{% static 'ckeditor5-builder/ckeditor5/ckeditor.js' %}"></script>
  <link rel="stylesheet" href="{% static 'ckeditor5-builder/ckeditor5/ckeditor5.css' %}">
  <link rel="stylesheet" href="{% static 'ckeditor5-builder/ckeditor5/ckeditor5-content.css' %}">
  <link rel="stylesheet" href="{% static 'css/ck.css' %}">

  <script>
    // Initialize CKEditor 5 with custom configuration
    document.addEventListener('DOMContentLoaded', function() {
      const editorElement = document.querySelector('#id_answer');
      if (editorElement) {
        ClassicEditor
          .create(editorElement, {
            language: 'en',
            removePlugins: ['CKFinderUploadAdapter', 'CKFinder', 'CKBox', 'EasyImage', 'ImageCaption', 'ImageStyle', 'ImageToolbar', 'ImageUpload', 'MediaEmbed'],
            toolbar: [
              'heading', '|',
              'bold', 'italic', 'link', 'bulletedList', 'numberedList', 'blockQuote', '|',
              'fontBackgroundColor', 'fontColor', 'fontSize', 'fontFamily', '|',
              'alignment', 'indent', 'outdent', '|',
              'undo', 'redo'
            ],
            image: {
              toolbar: [
                'imageTextAlternative',
                'imageStyle:inline',
                'imageStyle:block',
                'imageStyle:side',
                'linkImage'
              ]
            },
            table: {
              contentToolbar: [
                'tableColumn',
                'tableRow',
                'mergeTableCells',
                'tableProperties',
                'tableCellProperties'
              ]
            },
            link: {
              decorators: {
                openInNewTab: {
                  mode: 'manual',
                  label: 'Open in a new tab',
                  defaultValue: true,
                  attributes: {
                    target: '_blank',
                    rel: 'noopener noreferrer'
                  }
                }
              }
            }
          })
          .then(editor => {
            console.log('CKEditor 5 initialized successfully');
            window.editor = editor; // Make editor available in console for debugging
          })
          .catch(error => {
            console.error('Error initializing CKEditor 5:', error);
          });
      }
    });
  </script>

</c-base>
