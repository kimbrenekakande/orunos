{% load static %}
<div class="h-full w-full flex items-center justify-center bg-orange-100">
        
  <form action=" {% url 'home' %}" method="post" class="flex flex-col items-center justify-center text-white gap-2 border-2 border-gray-400 rounded-md p-8">
    {% csrf_token %}
    
    <div class="flex flex-col gap-2 pt-4">
      <label for="id_question" class="hidden">Question</label>
      <textarea name="question" id="id_question" placeholder="Enter The Question Here..." class="h-[20vh] w-[65vh] p-1 active:border-0 active:outline-none active:ring-2 active:ring-orange-700"></textarea>
    </div>

    <div class="flex w-full justify-between">
      <div class="h-8 w-8 cursor-pointer">
        <svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 16 16"><path fill="#000" fill-rule="evenodd" d="M3.47 6.53a.75.75 0 0 1 1.06 1.061l-.727.727a2.743 2.743 0 0 0 3.879 3.879l.727-.727a.75.75 0 0 1 1.06 1.06l-.726.727a4.243 4.243 0 0 1-6-6zm8 1.879a.75.75 0 0 0 1.06 1.06l.727-.726a4.243 4.243 0 0 0-6-6l-.727.727a.75.75 0 0 0 1.061 1.06l.727-.727a2.743 2.743 0 0 1 3.879 3.879zm-.94-1.879a.75.75 0 1 0-1.06-1.06l-4 4a.75.75 0 1 0 1.06 1.06z" clip-rule="evenodd"/></svg>      </div>
      <button hx-post="{% url 'home' %}" hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}' hx-trigger='click' hx-target="#main-content" hx-swap="innerHTML"
      type="submit" 
      class="hover:bg-orange-700  text-black bg-orange-600  h-8 w-8 rounded-full cursor-pointer motion-preset-fade-lg hover:motion-preset-pulse hover:loop-once-1">
      &uarr;
    </button>
    </div>
  </form>
</div>
