<div class="h-full flex items-center justify-center">
        
  <form action=" {% url 'home' %}" method="post" class="flex flex-col items-center justify-center bg-black text-white gap-16">
    {% csrf_token %}
    <h2 class="text-2xl">CourseWork Question(s)</h2>
    
    <div class="flex flex-col gap-2 pt-4">
      <label for="id_question" class="hidden">Question</label>
      <textarea name="question" id="id_question" placeholder="Enter The Question Here..." class="h-[50vh] w-[65vh] border-1 border-white p-8 "></textarea>
    </div>

    <!--jhhjhj
    <div class="w-full flex justify-between">
      <p>Upload File Instead</p>
      <label for="file" class="bg-orange-500 hover:bg-orange-600 text-white font-bold py-1 px-4">
        Choose File
        <input type="file" name="file" id="file" class="hidden">
      </label>
    </div>
    -->

    <button hx-post="{% url 'home' %}" hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}' hx-trigger='click' hx-target="#main-content" hx-swap="innerHTML"
      type="submit" 
      class="border-2 border-orange-700  hover:bg-orange-700 h-20 w-20 rounded-full cursor-grab motion-preset-fade-lg hover:motion-preset-pulse hover:loop-once-1">
      Submit
    </button>
  </form>
</div>
